name: Bug report
description: Report a defect in the lapisroot CLI, the Shizuku APK, or the documentation.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove serial numbers, account data, and signing keys before submitting.
        For security issues, use the **Security report** template instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - lapisroot CLI
        - Shizuku APK (apk/)
        - CVE catalog / hunt
        - Build script / dependencies
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or `git rev-parse --short HEAD`.
      placeholder: v0.1.0 / 52b4a77
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and build
      description: Model, codename, OS build, SDK, and security patch level.
      placeholder: Redmi Note 15 Pro 5G (lapis), OS3.0.309.0.WPPMIXM, SDK 36, 2026-09-01
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel and KMI
      description: Output of `adb shell uname -r` and the KMI that lapisroot detects.
      placeholder: 6.1.138-android14-11-gabc / android14-6.1

  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - KernelSU init_boot (lapisroot CLI)
        - Shizuku APK (apk/)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: bootloader
    attributes:
      label: Bootloader state
      options:
        - Unlocked
        - Locked
        - Unknown
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python3 -m lapisroot ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the command output. Redact serials, tokens, and personal paths.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`lapisroot status`, `lapisroot hunt`, or the APK `last_run.txt`."
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and the README/docs.
          required: true
        - label: I removed serial numbers, keys, and personal data.
          required: true
        - label: I am testing on a device I own or am authorized to modify.
          required: true
