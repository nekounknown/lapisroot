name: Security report
description: Report a security issue in lapisroot without publishing exploit details.
title: "[security] "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post working exploit code, payloads, or sensitive details in a public issue.**
        If private vulnerability reporting is enabled, use **Security → Report a vulnerability**.
        Otherwise, share only a high-level summary here and ask the maintainer for a private channel.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - lapisroot CLI
        - Shizuku APK (apk/)
        - CVE catalog / hunt
        - Build script / dependencies
        - Documentation
    validations:
      required: true

  - type: input
    id: cve
    attributes:
      label: CVE or advisory (if known)
      placeholder: CVE-2026-98260 / none

  - type: dropdown
    id: severity
    attributes:
      label: Estimated severity
      options:
        - Critical
        - High
        - Medium
        - Low
        - Unknown
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph, without exploit details.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What could an attacker do, and on which versions/commits?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Affected version or commit
      placeholder: v0.1.0 / 52b4a77
    validations:
      required: true

  - type: dropdown
    id: disclosure
    attributes:
      label: Disclosure preference
      options:
        - Coordinated (private until fixed)
        - Public after 90 days
        - Already public (CVE/advisory)
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have not included working exploit code or personal data in this public issue.
          required: true
        - label: I tested the version/commit I am reporting.
          required: true
